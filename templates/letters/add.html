{% extends "base.html" %}

{% block title %}Write Letter - Our Forever ❤️{% endblock %}

{% block content %}
<div class="container" style="max-width: 700px;">
    <div style="margin-bottom: 20px;">
        <a href="{{ url_for('letters.letters') }}" style="text-decoration: none; color: var(--rose); font-weight: 600;">
            ← Back to Letters
        </a>
    </div>

    <div class="card" style="padding: 35px; background: rgba(255, 255, 255, 0.9);">
        <h2 style="font-size: 32px; margin-top: 0; text-align: center; color: var(--deep);">Write a Love Letter 💌</h2>
        <p style="text-align: center; margin-bottom: 30px; font-size: 14px; color: var(--deep-soft);">
            Put your feelings into words. You can optionally attach a beautiful photo memory.
        </p>

        <form method="POST" enctype="multipart/form-data">
            <!-- TITLE -->
            <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--deep);">Letter Title</label>
            <input type="text" name="title" placeholder="To My Favourite Person / Thinking of You ❤️" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #efc8d3; border-radius: 12px; box-sizing: border-box;" required>

            <!-- BODY CONTENT -->
            <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--deep);">Your Letter</label>
            <textarea name="letter" placeholder="Dear Love,..." rows="10" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #efc8d3; border-radius: 12px; box-sizing: border-box; resize: vertical; font-family: Georgia, serif; line-height: 1.8;" required></textarea>

            <!-- OPTIONAL PHOTO -->
            <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--deep);">Optional Photo Attachment</label>
            <input type="file" name="photo" accept="image/*" style="width: 100%; padding: 10px; margin-bottom: 30px; box-sizing: border-box;">

            <!-- PRIVATE CHECKBOX -->
            <div style="display: flex; align-items: center; margin-bottom: 30px;">
                <input type="checkbox" name="is_private" id="is-private" style="width: 20px; height: 20px; cursor: pointer; margin-right: 10px;" {% if request.args.get('private') == 'true' %}checked{% endif %}>
                <label for="is-private" style="cursor: pointer; font-weight: 500; color: var(--deep);">
                    🔒 Save to Private section
                </label>
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" class="btn" style="width: 100%; padding: 14px;">
                ❤️ Save & Send Letter
            </button>
        </form>
    </div>
</div>
{% endblock %}
