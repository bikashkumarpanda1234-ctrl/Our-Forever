{% extends "base.html" %}

{% block title %}Edit Song - Our Forever ❤️{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <div style="margin-bottom: 20px;">
        <a href="{{ url_for('admin.music') }}" style="text-decoration: none; color: var(--rose); font-weight: 600;">
            ← Back to Soundtrack List
        </a>
    </div>

    <div class="card" style="padding: 35px; background: rgba(255, 255, 255, 0.9);">
        <h2 style="font-size: 32px; margin-top: 0; text-align: center; color: var(--deep);">Edit Song Details 🎵</h2>
        
        <form method="POST" enctype="multipart/form-data">
            <!-- TITLE -->
            <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--deep);">Song Title</label>
            <input type="text" name="title" value="{{ music.title }}" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #efc8d3; border-radius: 12px; box-sizing: border-box;" required>

            <!-- ARTIST -->
            <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--deep);">Artist</label>
            <input type="text" name="artist" value="{{ music.artist }}" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #efc8d3; border-radius: 12px; box-sizing: border-box;">

            <!-- REPLACE AUDIO FILE -->
            <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--deep);">Replace Audio File (Optional)</label>
            <p style="font-size: 12px; color: var(--deep-soft); margin-top: 0; margin-bottom: 6px;">Current file: {{ music.file or "None" }}</p>
            <input type="file" name="song" accept="audio/*" style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #efc8d3; border-radius: 12px; box-sizing: border-box; background: white;">

            <!-- REPLACE COVER IMAGE -->
            <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--deep);">Replace Cover Image (Optional)</label>
            <p style="font-size: 12px; color: var(--deep-soft); margin-top: 0; margin-bottom: 6px;">Current cover: {{ music.cover or "None" }}</p>
            <input type="file" name="cover" accept="image/*" style="width: 100%; padding: 10px; margin-bottom: 30px; border: 1px solid #efc8d3; border-radius: 12px; box-sizing: border-box; background: white;">

            <!-- SUBMIT BUTTON -->
            <button type="submit" class="btn" style="width: 100%; padding: 14px;">
                ❤️ Update Song Details
            </button>
        </form>
    </div>
</div>
{% endblock %}
