{% extends "base.html" %}

{% block title %}Edit Shayari - Our Forever ❤️{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <div style="margin-bottom: 20px;">
        <a href="{{ url_for('admin.shayari') }}" style="text-decoration: none; color: var(--rose); font-weight: 600;">
            ← Back to Shayari List
        </a>
    </div>

    <div class="card" style="padding: 35px; background: rgba(255, 255, 255, 0.9);">
        <h2 style="font-size: 32px; margin-top: 0; text-align: center; color: var(--deep);">Edit Shayari ✍️</h2>
        
        <form method="POST">
            <!-- TITLE -->
            <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--deep);">Title (Optional)</label>
            <input type="text" name="title" value="{{ shayari.title or '' }}" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #efc8d3; border-radius: 12px; box-sizing: border-box;">

            <!-- SHAYARI TEXT -->
            <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--deep);">Shayari Verses</label>
            <textarea name="text" rows="6" style="width: 100%; padding: 12px; margin-bottom: 30px; border: 1px solid #efc8d3; border-radius: 12px; box-sizing: border-box; resize: vertical; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; line-height: 1.6; text-align: center;" required>{{ shayari.body }}</textarea>

            <!-- SUBMIT BUTTON -->
            <button type="submit" class="btn" style="width: 100%; padding: 14px;">
                ❤️ Update Shayari
            </button>
        </form>
    </div>
</div>
{% endblock %}
