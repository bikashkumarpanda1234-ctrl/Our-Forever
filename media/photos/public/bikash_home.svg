<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyBikash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="50%" stop-color="#d0e1ff"/>
      <stop offset="100%" stop-color="#a0c4ff"/>
    </linearGradient>
    <linearGradient id="homeBikash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
    <linearGradient id="roofBikash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a86ff"/>
      <stop offset="100%" stop-color="#1d3557"/>
    </linearGradient>
    <linearGradient id="jagannathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <filter id="glowBikash" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="500" fill="url(#skyBikash)"/>

  <!-- Soft Sunlight -->
  <circle cx="400" cy="180" r="280" fill="rgba(255, 255, 255, 0.4)" filter="url(#glowBikash)"/>

  <!-- Pathapur Jagannath Temple Spire Silhouette -->
  <path d="M 180 320 L 220 170 L 260 320 Z" fill="url(#jagannathGrad)" opacity="0.85"/>
  <path d="M 220 140 L 220 170" stroke="#fb8500" stroke-width="4"/>
  <polygon points="220,130 235,138 220,146" fill="#e63946"/>
  <text x="220" y="340" font-family="'Poppins', sans-serif" font-size="14" fill="#1d3557" font-weight="bold" text-anchor="middle">🛕 Jagannath Temple</text>

  <!-- Bikash's Home -->
  <rect x="330" y="240" width="240" height="150" rx="12" fill="url(#homeBikash)" stroke="#3a86ff" stroke-width="3" filter="url(#glowBikash)"/>
  <path d="M 310 245 L 450 140 L 590 245 Z" fill="url(#roofBikash)"/>
  
  <!-- Door -->
  <path d="M 420 310 Q 450 280 480 310 L 480 390 L 420 390 Z" fill="#1d3557"/>
  <circle cx="470" cy="350" r="4" fill="#ffb703"/>

  <!-- Windows -->
  <rect x="360" y="270" width="40" height="45" rx="6" fill="#e8f0fe" stroke="#3a86ff" stroke-width="2"/>
  <line x1="380" y1="270" x2="380" y2="315" stroke="#3a86ff" stroke-width="2"/>
  <line x1="360" y1="292" x2="400" y2="292" stroke="#3a86ff" stroke-width="2"/>

  <rect x="500" y="270" width="40" height="45" rx="6" fill="#e8f0fe" stroke="#3a86ff" stroke-width="2"/>
  <line x1="520" y1="270" x2="520" y2="315" stroke="#3a86ff" stroke-width="2"/>
  <line x1="500" y1="292" x2="540" y2="292" stroke="#3a86ff" stroke-width="2"/>

  <!-- Floating Elements -->
  <text x="450" y="125" font-size="38" filter="url(#glowBikash)">💙</text>
  <text x="310" y="200" font-size="28">✨</text>
  <text x="570" y="190" font-size="28">🌿</text>
  <text x="260" y="260" font-size="24">🌾</text>
  <text x="620" y="270" font-size="24">💙</text>

  <!-- Banner Text -->
  <rect x="160" y="415" width="480" height="55" rx="28" fill="rgba(255, 255, 255, 0.94)" stroke="#3a86ff" stroke-width="2" filter="url(#glowBikash)"/>
  <text x="400" y="442" font-family="'Georgia', serif" font-size="20" fill="#1d3557" font-weight="bold" text-anchor="middle">
    🏠 Bikash Kumar Panda's Home • Pathapur
  </text>
  <text x="400" y="460" font-family="'Poppins', sans-serif" font-size="12" fill="#3a86ff" text-anchor="middle">
    Talua Balikuda, Pathapur Village Road (Near Jagannath Temple), Jajpur
  </text>
</svg>
